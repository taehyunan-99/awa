# 카테고리별 안전 패턴. 위에서 아래로 매칭 (먼저 매칭되는 카테고리 채택).
# 각 패턴은 Tool(prefix:*) 형식 또는 Tool(exact) — settings.json 의 allow 와 동일.
# 적용 시점: permission-gate hook 의 classify 단계 — danger → matrix → auto(여기) → gray 순.
# danger_check 통과 후에만 도달하므로 위험 명령은 orch-auto-allow 에 닿기 전 자동 거부.
# → 위험 패턴 포함 금지 (방어선 다층화).
# 파서: bin/matrix-lookup.sh 의 awk 파서. 단순 형식만: category: + 들여쓰기 2칸 + - "패턴".
read-only:
  - "Bash(ls:*)"
  - "Bash(cat:*)"
  - "Bash(head:*)"
  - "Bash(tail:*)"
  - "Bash(sed -n:*)"
  - "Bash(grep:*)"
  - "Bash(rg:*)"
  - "Bash(find:*)"
  - "Bash(wc:*)"
  - "Bash(file:*)"
  - "Bash(stat:*)"
  - "Bash(diff:*)"
  - "Bash(which:*)"
  - "Bash(echo:*)"
  # 부작용 0 순수 출력 도구 (게이트 폭주 완화 2026-06-03). 명령실행·쓰기·네트워크 없음.
  # 제외: awk(system() 명령실행 가능)·env/printenv(비밀정보 노출)·node/python(임의코드, gray 유지 —
  #   단 `--version`/`-v` 만 아래 version-probe 카테고리에 exact 등록).
  - "Bash(nl:*)"
  - "Bash(od:*)"
  - "Bash(cut:*)"
  - "Bash(sort:*)"
  - "Bash(uniq:*)"
  - "Bash(comm:*)"
  - "Bash(column:*)"
  - "Bash(tr:*)"
  - "Bash(basename:*)"
  - "Bash(dirname:*)"
  - "Bash(realpath:*)"
  - "Bash(jq:*)"
  - "Bash(cmp:*)"
  - "Bash(cksum:*)"
  - "Bash(du:*)"
  - "Bash(pwd:*)"
  - "Bash(tree:*)"
  - "Read"
  - "Glob"
  - "Grep"
version-probe:
  # 버전 조회 전용 — 부작용 0(코드 실행 아님). node/python 전체는 gray 유지(임의코드 위험)지만
  # `<runtime> --version`/`-v` 만 exact 등록해 게이트 폭주 완화(2026-06-09 재테스트 진단).
  # exact 패턴이라 `node evil.js` 는 여전히 gray — 인자 임의실행 경로 안 열림.
  - "Bash(node --version)"
  - "Bash(node -v)"
  - "Bash(python --version)"
  - "Bash(python3 --version)"
  - "Bash(npm --version)"
  - "Bash(npm -v)"
  - "Bash(npx --version)"
  - "Bash(tsc --version)"
  - "Bash(go version)"
  - "Bash(cargo --version)"
git-readonly:
  - "Bash(git status:*)"
  - "Bash(git diff:*)"
  - "Bash(git log:*)"
  - "Bash(git show:*)"
  - "Bash(git branch:*)"
  - "Bash(git remote:*)"
  # git hash-object = 객체 해시 계산. 글롭이라 -w(객체 DB write)도 매칭되나 작업트리/파일시스템은
  # 안 건드림(git 내부 object store 한정) → 가역성 검증 워커 패턴, 위험도 낮음.
  # 첫 가동 게이트 폭주 완화(2026-06-12 llmwiki 가동). ★단일명령으로 호출해야 학습됨:
  # `git hash-object a && git hash-object b` 복합형은 안전 prefix 도출 실패로 1회 허용 강등.
  - "Bash(git hash-object:*)"
safe-test:
  - "Bash(pytest:*)"
  - "Bash(python -m pytest:*)"
  - "Bash(npm test:*)"
  - "Bash(jest:*)"
  - "Bash(cargo test:*)"
  - "Bash(go test:*)"
safe-build:
  - "Bash(npm run build:*)"
  - "Bash(cargo build:*)"
  - "Bash(make:*)"
  - "Bash(go build:*)"
  - "Bash(tsc:*)"
dev-deps:
  # 공급망 공격 보수 정책(§9): 락 파일 기반 install 만 허용.
  # npm install <pkg> / pip install <pkg> 임의 패키지명은 *제외* — pending-ask 로.
  - "Bash(npm ci:*)"
  - "Bash(pip install -r:*)"
  - "Bash(cargo fetch:*)"
safe-fs:
  # 안전한 파일시스템 생성. rm 류는 danger-check(rm-recursive)·워커 deny 가 차단.
  # chmod 는 +x 만 — chmod 777/o+w 는 danger-check(chmod-world)가 잡음.
  - "Bash(mkdir:*)"
  - "Bash(touch:*)"
  - "Bash(chmod +x:*)"
git-write:
  # 로컬 git 쓰기 (add/commit 만). push/force/reset --hard/clean -f 는 danger·deny 차단.
  # checkout/switch 는 git checkout -- file/. 가 작업 파괴(데이터손실)라 의도적 제외 →
  # 회색으로 두어 사람이 1회 인지.
  - "Bash(git add:*)"
  - "Bash(git commit:*)"
harness-infra:
  # 하니스 자체 메커니즘 — 워커가 task 완료 시 *반드시* 호출하는 내부 통신 명령(P2 수정 2026-05-30).
  # prompts/_common.md 가 워커에게 지시하는 완료신호·이벤트로그 append. 사용자 학습 대상이 아니라
  # 하니스가 워커에게 시킨 고정 명령이므로 전역 기본 카탈로그에 박제 — 첫 사이클부터 게이트 미발생.
  # 둘 다 danger-check SAFE 확인필(printf=부작용없는 출력, >> 민감경로는 danger-check 가 별도 차단).
  - "Bash(tmux wait-for:*)"
  - "Bash(printf:*)"
self-verify:
  # 워커 자가검증 — engineer 가 자기 구현을 source-then-call 이나 스크립트 실행으로 확인
  #   (`. ./src/x.sh && fn`, `bash ./src/x.sh args`). 게이트 봉쇄 해소(2026-06-01):
  #   이 패턴 없으면 gray → 격리/자동 환경서 USER-ASK 응답없어 타임아웃 DENY → done 못 냄.
  # ★ 안전: danger_check 의 exec-sensitive 가 *먼저* 평가(danger→matrix→auto)돼 절대 시스템·민감
  #   경로 실행(`. /etc/x`·`bash /usr/bin/evil.sh`)을 차단. bash/sh -c 는 bash-c-wrapper 거부.
  #   여기 도달 = 프로젝트 내부 스크립트 실행만. source 든 bash 든 hook 미경유는 동일 신뢰모델
  #   (워커가 작성한 프로젝트 스크립트 — claude Bash 도구 1호출만 가로채지 자식 명령은 못 봄).
  - "Bash(. :*)"
  - "Bash(source :*)"
  - "Bash(bash :*)"
  - "Bash(sh :*)"

# 학습된 패턴 — add_to_allow 가 사용자 승인 후 누적 (Phase A, §7)
learned:
