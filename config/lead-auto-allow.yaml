# 카테고리별 안전 패턴. 위에서 아래로 매칭 (먼저 매칭되는 카테고리 채택).
# 각 패턴은 Tool(prefix:*) 형식 또는 Tool(exact) — settings.json 의 allow 와 동일.
# 적용 시점: permission-gate hook 의 classify 단계 — danger → matrix → auto(여기) → gray 순.
# danger_check 통과 후에만 도달하므로 위험 명령은 lead-auto-allow 에 닿기 전 자동 거부.
# → 위험 패턴 포함 금지 (방어선 다층화).
# 파서: bin/matrix-lookup.sh 의 awk 파서. 단순 형식만: category: + 들여쓰기 2칸 + - "패턴".
read-only:
  - "Bash(ls:*)"
  - "Bash(cat:*)"
  - "Bash(head:*)"
  - "Bash(tail:*)"
  - "Bash(grep:*)"
  - "Bash(rg:*)"
  - "Bash(find:*)"
  - "Bash(wc:*)"
  - "Bash(file:*)"
  - "Bash(stat:*)"
  - "Bash(diff:*)"
  - "Bash(which:*)"
  - "Bash(echo:*)"
  - "Read"
  - "Glob"
  - "Grep"
git-readonly:
  - "Bash(git status:*)"
  - "Bash(git diff:*)"
  - "Bash(git log:*)"
  - "Bash(git show:*)"
  - "Bash(git branch:*)"
  - "Bash(git remote:*)"
safe-test:
  - "Bash(pytest:*)"
  - "Bash(python -m pytest:*)"
  - "Bash(npm test:*)"
  - "Bash(jest:*)"
  - "Bash(cargo test:*)"
  - "Bash(go test:*)"
safe-build:
  - "Bash(npm run build:*)"
  - "Bash(cargo build:*)"
  - "Bash(make:*)"
  - "Bash(go build:*)"
  - "Bash(tsc:*)"
dev-deps:
  # 공급망 공격 보수 정책(§9): 락 파일 기반 install 만 허용.
  # npm install <pkg> / pip install <pkg> 임의 패키지명은 *제외* — pending-ask 로.
  - "Bash(npm ci:*)"
  - "Bash(pip install -r:*)"
  - "Bash(cargo fetch:*)"
safe-fs:
  # 안전한 파일시스템 생성. rm 류는 danger-check(rm-recursive)·워커 deny 가 차단.
  # chmod 는 +x 만 — chmod 777/o+w 는 danger-check(chmod-world)가 잡음.
  - "Bash(mkdir:*)"
  - "Bash(touch:*)"
  - "Bash(chmod +x:*)"
git-write:
  # 로컬 git 쓰기 (add/commit 만). push/force/reset --hard/clean -f 는 danger·deny 차단.
  # checkout/switch 는 git checkout -- file/. 가 작업 파괴(데이터손실)라 의도적 제외 →
  # 회색으로 두어 사람이 1회 인지.
  - "Bash(git add:*)"
  - "Bash(git commit:*)"
